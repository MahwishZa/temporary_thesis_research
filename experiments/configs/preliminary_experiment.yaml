# Canonical configuration for the preliminary RAG2-vs-SCAF comparison.
#
# One file, no hidden defaults: every experimental parameter that can change a
# result is named here. The run manifest records the resolved values plus the
# environment, so a number can always be traced back to the configuration that
# produced it.
#
# Two profiles. They differ ONLY in provenance -- never in method:
#
#   development  offline; lexical retrieval stand-in, no filter checkpoint, no
#                generator. Exercises the wiring. Its manifest is stamped
#                "DEVELOPMENT RUN -- NOT A SCIENTIFIC RESULT".
#   scientific   the reportable run. Every field below must be satisfied; the
#                runner's --scientific flag aborts if any precondition fails.

experiment:
  name: rag2-vs-scaf-preliminary
  seed: 42
  label: PRELIMINARY / DEVELOPMENT RESULTS
  output_dir: experiments/runs

# --- questions -------------------------------------------------------------
questions:
  file: data/datasets/thesis_questions/dev_questions.jsonl
  set_version: alzheimer-dev-v1
  count: 30
  # Fixed BEFORE any comparison result was inspected. No gold answers: this
  # milestone compares admission, not accuracy.
  has_gold_answers: false

# --- corpus and index ------------------------------------------------------
# Do not rebuild any of this. Verify it with preprocessing/pmc/verify_index.py.
corpus:
  chunks: data/corpora/pmc/chunks/chunks.jsonl
  chunk_stats: data/corpora/pmc/chunks/chunk_stats.json
  production_chunks: 781563
  production_documents: 42964
  production_unique_chunk_texts: 773183
  # Recorded at freeze time from index_meta.json; the freeze fails if absent.
  index_dir: indexes/production
  index_encoder: ncbi/MedCPT-Article-Encoder
  index_dim: 768
  # ENVIRONMENT-SPECIFIC: a property of the machine holding the index. Recorded
  # only after verify_index.py reported 16/16 on 2026-09-09 and recomputed this
  # digest from the vectors themselves -- it is a checked claim, not a copied one.
  # 773,183 vectors = 781,563 chunks - 8,380 flagged duplicates, row-aligned to
  # the manifest. Any future run whose index digest differs is a different index.
  index_digest: "2ab50a1212681abd28f4f250d49f076c36f57d1b3a77ce5aaac093adde770937"
  index_verified_by: "python preprocessing/pmc/verify_index.py"   # must report 16/16

# --- upstream: retrieval and reranking (frozen once, shared by both arms) ---
retrieval:
  # development: lexical-dev  |  scientific: medcpt   <- the runner enforces this
  source: medcpt
  query_encoder: ncbi/MedCPT-Query-Encoder
  reranker: ncbi/MedCPT-Cross-Encoder
  candidates_per_corpus: 100
  candidate_depth: 20               # kept per question after reranking
  rerank_query: initial             # paper's reading; 'rationale' is the code path
  shard_merge: score
  frozen_file: experiments/runs/frozen_candidates.jsonl
  # ENVIRONMENT-SPECIFIC: emitted by experiments/scripts/freeze_candidates.py.
  frozen_set_digest: ""             # filled by the freeze step; cite it with results
  # SCAF's support scorer needs corpus IDF; the freeze step computes it from the
  # same chunk file the candidates came from and stores it in the sidecar.
  corpus_statistics_from_freeze: true

# --- ARM A: the original RAG2 admission policy -----------------------------
arm_a:
  filter: rag2_perplexity           # MUST NOT be passthrough for a reported run
  # These are the PAPER's values and are kept as the reference target. The
  # thesis run on a 4 GB RTX 2050 uses the Alzheimer route instead
  # (architecture/rag2/configs/thesis_alzheimer_filter.yaml: flan-t5-small,
  # 8 epochs, corpus-derived weakly supervised labels). If you run that route,
  # set base_model and checkpoint below to what you actually trained, so this
  # file does not describe a run that did not happen. Neither field is read by
  # the runner -- it records arm_a_checkpoint_identity from the checkpoint on
  # disk -- so an unedited base_model misleads a reader without failing a check.
  # See docs/windows_runbook.md sections 4A/5A/6A.
  base_model: google/flan-t5-large  # paper 4.2, 770M
  # ENVIRONMENT-SPECIFIC: produced by
  # architecture/rag2/scripts/04_train_filter.py --select.
  # The run manifest records its resolved path, file listing, sizes, mtimes and a
  # digest over that listing (arm_a_checkpoint_identity). Weight bytes are not
  # hashed: a HF checkpoint is multi-GB and the listing identifies it adequately.
  checkpoint: ""                    # REQUIRED. Not distributed by the RAG2 authors.
  max_seq_length: 512
  doc_stride: 128
  overflow: truncate
  # Filter training (architecture/rag2/scripts/03 then 04). Appendix A.3 values.
  training:
    learning_rate: 3.0e-5
    num_train_epochs: 40
    per_device_train_batch_size: 16
    tau_percentile: 25              # "top 25% of perplexity differentials"
    tau_scope: global
    ppl_target: rationale           # Eq.4 literally says query; prose+Fig.2 say rationale
    select_by: val_accuracy
    seed: 42

# --- ARM B: the thesis SCAF admission policy -------------------------------
arm_b:
  filter: scaf
  weights:                          # A(s) = w_s*sigma + w_g*gamma + w_r*rho + w_t*tau
    support: 0.50
    currency: 0.30
    corroboration: 0.0              # rho NOT IMPLEMENTED at this stage
    authority: 0.20
  admit_threshold: 0.45             # a-priori. NOT tuned on the evaluation set.
  max_admit: 0                      # 0 = uncapped
  abstain: true
  reject_retracted: true
  half_life_years: 5.0
  superseded_discount: 0.5
  as_of: ""                         # blank = today; pin it for a reproducible run
  support:
    scorer: lexical-coverage-corpus-idf-v2
    is_entailment: false            # PROTOTYPE. Replace before any thesis claim.
    # document_frequency + corpus_size are computed at freeze time from the same
    # chunk file the candidates came from, and travel in the frozen sidecar.
  authority_tiers:                  # ablation A12 treats this ordering as a VARIABLE
    clinical-practice-guideline: 1.00
    appropriate-use-criteria: 0.85
    diagnostic-criteria: 0.85
    consensus-recommendation: 0.70
    "": 0.40
  category_authority:
    currency-pack: 0.60
    pmc-fulltext: 0.45
    pubmed-abstract: 0.40

# --- generation: identical for both arms -----------------------------------
# Both arms are driven by ONE generator object built from this block
# (architecture/scaf/generation.py), so "same generator, same decoding" is
# structural rather than a claim. Answers come from rag2's own answer prompt
# over the admitted evidence -- no second prompt path exists.
generation:
  backend: huggingface              # huggingface | vllm | openai. NOT 'stub'.
  model: meta-llama/Meta-Llama-3-8B-Instruct   # paper 4.2 footnote 2. GATED.
  revision: ""                      # ENVIRONMENT-SPECIFIC: pin per run; the
                                    # resolved commit is recorded in the manifest
  dtype: bfloat16
  device: auto
  temperature: 0.0                  # paper A.3: greedy. >0 is rejected.
  top_p: 1.0
  max_new_tokens: 512
  max_input_tokens: 0               # 0 = model default
  batch_size: 8
  chat_template: true               # instruct models need their own template
  prompt_version: rag2-original-v1
  seed: 42

# --- outputs ---------------------------------------------------------------
outputs:
  per_question: experiments/runs/per_question.jsonl
  manifest: experiments/runs/manifest.json
  report: THESIS.md
