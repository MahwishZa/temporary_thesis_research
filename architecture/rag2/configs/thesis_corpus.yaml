# The original RAG2 baseline, retrieving over THIS repository's corpus.
#
# Inherit from this file rather than corpora.example.yaml when running the
# baseline on the Alzheimer/dementia corpus built under pmc/. It changes only
# where evidence comes from; every method-level setting stays at the value
# docs/rag2_reproduction.md justifies from the paper.
#
# Prerequisites, both built on the machine holding the MedCPT weights:
#     python pmc/build_chunks.py          ->  pmc/chunks/chunks.jsonl
#     python pmc/embed_chunks.py          ->  pmc/index/{embeddings.f32,
#                                             index_manifest.jsonl, index_meta.json}
# Neither is committed (see .gitignore); both are deterministic rebuilds.
#
# Corpus paths below are relative to the REPOSITORY ROOT, so run the stage
# scripts from there:
#     python rag2/scripts/02_retrieve.py -c rag2/configs/thesis_corpus.yaml
# (or override with -o retrieval.corpora[0].options.index_dir=... for a copy
# held elsewhere).
#
# Balanced retrieval (paper section 3.4) draws an equal quota from each corpus.
# The paper has four; this corpus has three source categories, so the quota is
# split three ways. docs/rag2_reproduction_audit.md section 4 records what that
# substitution does and does not change.

experiment:
  name: rag2-baseline-thesis-corpus
  notes: "Original RAG2 baseline over the pmc/ corpus. No thesis extension."
  seed: 42

dataset:
  loader: jsonl
  name: ""                        # set per run; recorded in the manifest
  version: ""                     # set per run
  path: ""
  split: test

retrieval:
  # [S] MedCPT throughout -- the paper's retriever, and the encoder pmc/embed_chunks.py
  # used to build the index. Do not substitute another model: the vectors on disk
  # are MedCPT vectors.
  query_encoder: ncbi/MedCPT-Query-Encoder
  article_encoder: ncbi/MedCPT-Article-Encoder
  reranker: ncbi/MedCPT-Cross-Encoder
  embedding_dim: 768

  candidates_per_corpus: 100      # [A] the release's --top_k default
  final_top_k: 8                  # sweep {1,2,4,8,16,32} per Figure 3
  rerank_query: initial           # [D] the paper says initial; 'rationale' is the code path
  shard_merge: score              # [D] keeps the per-corpus quota exact

  corpora:
    - name: pubmed-abstract
      loader: thesis_chunks
      options: &thesis_chunk_options
        index_dir: pmc/index
        chunks_path: pmc/chunks/chunks.jsonl
        # Exact-duplicate chunks are flagged (not deleted) by build_chunks.py and
        # skipped by embed_chunks.py, so this is belt-and-braces.
        drop_duplicate_chunks: true
        # Refuses a stub-encoder index. Never set false for reported results.
        require_production_index: true
    - name: pmc-fulltext
      loader: thesis_chunks
      options:
        <<: *thesis_chunk_options
    - name: currency-pack
      loader: thesis_chunks
      options:
        <<: *thesis_chunk_options

llm:
  backend: huggingface
  model: meta-llama/Meta-Llama-3-8B-Instruct   # [S] paper section 4.2 footnote 2
  revision: ""                    # pin per run; recorded in the manifest
  temperature: 0.0                # [S] appendix A.3

filter:
  kind: rag2_perplexity
  base_model: google/flan-t5-large             # [S] paper section 4.2 (770M)
  checkpoint: ""                  # must be trained: the paper's is not distributed
  on_empty: no_evidence

cache:
  dir: cache/candidates
