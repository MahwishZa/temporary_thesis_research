# The original RAG2 baseline, retrieving over THIS repository's corpus.
#
# Inherit from this file rather than corpora.example.yaml when running the
# baseline on the Alzheimer/dementia corpus under data/corpora/pmc/. It changes
# only where evidence comes from; every method-level setting stays at the value
# docs/reproduction/rag2_reproduction.md justifies from the paper.
#
# Prerequisites, both built on the machine holding the MedCPT weights:
#     python preprocessing/pmc/build_chunks.py
#         ->  data/corpora/pmc/chunks/chunks.jsonl
#     python preprocessing/pmc/embed_chunks.py
#         ->  indexes/production/{embeddings.f32, index_manifest.jsonl,
#                                 index_meta.json}
# Neither is committed (see .gitignore); both are deterministic rebuilds.
#
# Corpus paths below are relative to the REPOSITORY ROOT, so run the stage
# scripts from there:
#     python architecture/rag2/scripts/02_retrieve.py \
#         -c architecture/rag2/configs/thesis_corpus.yaml
# (or override with -o retrieval.corpora[0].options.index_dir=... for a copy
# held elsewhere).
#
# Balanced retrieval (paper section 3.4) draws an equal quota from each corpus.
# The paper has four; this corpus has three source categories, so the quota is
# split three ways. docs/reproduction/rag2_reproduction_audit.md section 4
# records what that substitution does and does not change.

experiment:
  name: rag2-baseline-thesis-corpus
  notes: "Original RAG2 baseline over the thesis PMC corpus. No thesis extension."
  seed: 42

dataset:
  loader: jsonl
  name: alzheimer-dev-v1
  version: v1
  # The committed thesis question set. Open-ended: 30 questions, no options and
  # no gold answer -- this milestone compares admission, not accuracy.
  path: data/datasets/thesis_questions/dev_questions.jsonl
  split: test                     # recorded in the manifest; selects no subset
  options:
    fields:
      # This set keys on 'qid', not the loader's default 'id'. Without this map
      # the loader falls back to the row index and every question is renamed
      # 0..29 -- which silently breaks the join to the frozen candidate sets,
      # because SCAF and the comparison runner match on qid.
      qid: qid
    # psi(q) for SCAF's currency term, and the set identity, must survive into
    # Question.metadata; the freeze step copies them into question_metadata.
    metadata_fields: [time_sensitive, set]

retrieval:
  # [S] MedCPT throughout -- the paper's retriever, and the encoder
  # preprocessing/pmc/embed_chunks.py used to build the index. Do not substitute
  # another model: the vectors on disk are MedCPT vectors.
  query_encoder: ncbi/MedCPT-Query-Encoder
  article_encoder: ncbi/MedCPT-Article-Encoder
  reranker: ncbi/MedCPT-Cross-Encoder
  embedding_dim: 768

  candidates_per_corpus: 100      # [A] the release's --top_k default
  final_top_k: 8                  # sweep {1,2,4,8,16,32} per Figure 3
  rerank_query: initial           # [D] the paper says initial; 'rationale' is the code path
  shard_merge: score              # [D] keeps the per-corpus quota exact

  corpora:
    - name: pubmed-abstract
      loader: thesis_chunks
      options: &thesis_chunk_options
        index_dir: indexes/production
        chunks_path: data/corpora/pmc/chunks/chunks.jsonl
        # Exact-duplicate chunks are flagged (not deleted) by build_chunks.py and
        # skipped by embed_chunks.py, so this is belt-and-braces.
        drop_duplicate_chunks: true
        # Refuses a stub-encoder index. Never set false for reported results.
        require_production_index: true
    - name: pmc-fulltext
      loader: thesis_chunks
      options:
        <<: *thesis_chunk_options
    - name: currency-pack
      loader: thesis_chunks
      options:
        <<: *thesis_chunk_options

llm:
  backend: huggingface
  model: meta-llama/Meta-Llama-3-8B-Instruct   # [S] paper section 4.2 footnote 2
  revision: ""                    # pin per run; recorded in the manifest
  temperature: 0.0                # [S] appendix A.3

filter:
  kind: rag2_perplexity
  base_model: google/flan-t5-large             # [S] paper section 4.2 (770M)
  checkpoint: ""                  # must be trained: the paper's is not distributed
  on_empty: no_evidence

cache:
  dir: cache/candidates
